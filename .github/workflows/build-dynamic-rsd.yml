name: Build Husk Dynamic RSD IPA

on:
  push:
    branches:
      - fix/dynamic-remotepairing-port
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: xcode-27
    timeout-minutes: 350
    steps:
      - name: Checkout patched fork
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Toolchain and space check
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          df -h .
          /usr/bin/python3 --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Xcode Metal Toolchain
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          echo "Xcode: $(xcode-select -p)"
          # Xcode 26+ distributes the Metal compiler as an optional component.
          # Without it, WebKit ANGLE cannot compile its Metal shaders.
          xcodebuild -downloadComponent MetalToolchain
          echo "Metal compiler:"
          xcrun --sdk iphoneos --find metal
          echo "Metal library linker:"
          xcrun --sdk iphoneos --find metallib

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install meson ninja pkg-config xcodegen qemu cmake autoconf automake libtool gettext
          rustup target add aarch64-apple-ios
          command -v meson ninja pkg-config xcodegen qemu-img cargo
          df -h .

      - name: Build and package from clean checkout
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/ci_build.sh "$GITHUB_WORKSPACE/build/Husk.ipa" 2>&1 | tee "$RUNNER_TEMP/husk-ci-build.log"
          test -s build/Husk.ipa
          test -s build/Husk.tipa
          unzip -t build/Husk.ipa | tail -1
          ls -lh build/Husk.{ipa,tipa}

      - name: Upload Husk IPA and TrollStore package
        uses: actions/upload-artifact@v4
        with:
          name: Husk-dynamic-rsd-packages
          path: |
            build/Husk.ipa
            build/Husk.tipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Show actionable errors in job summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Husk build failure diagnostics"
            echo '### Last compiler / dependency errors'
            echo '```text'
            if [ -f "$RUNNER_TEMP/husk-ci-build.log" ]; then
              grep -aEi 'error:|failed|fatal:|no space left|not found|cannot find|unsupported|no such file' "$RUNNER_TEMP/husk-ci-build.log" | tail -60 || true
              echo "--- tail ---"
              tail -80 "$RUNNER_TEMP/husk-ci-build.log"
            else
              echo "Build log was not created; check earlier workflow steps."
            fi
            echo '```'
            echo '### Remaining disk space'
            df -h .
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-build-logs
          path: |
            ${{ runner.temp }}/husk-ci-build.log
            build/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
